# 모바일 버전(mobile/)을 안드로이드 APK 로 빌드해서 Releases 의 apk-latest 에 올린다.
# apk-build 브랜치에 올리면 자동으로 실행된다.
name: 안드로이드 APK 빌드

on:
  push:
    branches: [apk-build]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: 웹 빌드
        run: |
          npm ci
          npx tsc --noEmit
          npx vite build

      - name: 안드로이드 프로젝트에 웹 빌드 복사
        run: npx cap sync android

      - name: APK 빌드
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../block-breaker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: block-breaker-apk
          path: block-breaker.apk

      - name: Releases 에 올리기
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --cleanup-tag -y || true
          gh release create apk-latest block-breaker.apk \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "블록 브레이커 안드로이드 테스트판" \
            --notes "휴대폰에서 block-breaker.apk 를 눌러 받은 뒤 설치하세요. '출처를 알 수 없는 앱' 설치를 허용해야 할 수 있어요. 테스트용(debug) 빌드라 새 버전을 설치할 때 이전 앱을 먼저 지워야 할 수 있어요."
