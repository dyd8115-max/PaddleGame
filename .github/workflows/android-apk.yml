# 모바일 버전(mobile/)을 안드로이드 APK 로 빌드해서 Releases 의 apk-latest 에 올린다.
# apk-build 브랜치에 올리면 자동으로 실행된다.
name: 안드로이드 APK 빌드

on:
  push:
    branches: [apk-build]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    # 안드로이드 SDK 가 미리 설치된 이미지
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: 웹 빌드
        working-directory: mobile
        run: |
          set -o pipefail
          { npm ci && npx tsc --noEmit && npx vite build && npx cap sync android; } 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: APK 빌드
        working-directory: mobile/android
        run: |
          set -o pipefail
          echo "ANDROID_HOME=$ANDROID_HOME" | tee -a "$RUNNER_TEMP/build.log"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/block-breaker.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: block-breaker-apk
          path: block-breaker.apk

      - name: Releases 에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --cleanup-tag -y || true
          gh release create apk-latest block-breaker.apk \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "블록 브레이커 안드로이드 테스트판" \
            --notes "휴대폰에서 block-breaker.apk 를 눌러 받은 뒤 설치하세요. '출처를 알 수 없는 앱' 설치를 허용해야 할 수 있어요. 테스트용(debug) 빌드라 새 버전을 설치할 때 이전 앱을 먼저 지워야 할 수 있어요."

      # 실패하면 마지막 로그를 오류 표시로 남김 (커밋 화면에서 바로 확인)
      - name: 실패 로그
        if: failure()
        run: |
          touch "$RUNNER_TEMP/build.log"
          msg=$(tail -n 50 "$RUNNER_TEMP/build.log" | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"}{print}')
          echo "::error title=빌드 실패 로그::${msg}"
