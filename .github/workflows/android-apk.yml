# 모바일 버전(mobile/)을 안드로이드 앱으로 빌드한다.
# - 테스트용 APK (debug): 폰에 바로 설치해 보는 용도
# - 출시용 AAB (서명됨): 구글 플레이 콘솔에 올리는 용도. 깃헙 비밀값의 업로드 키로 서명
# apk-build 브랜치에 올리면 자동으로 실행된다.
# 공개 Releases 는 직접 올리고, 여기서는 받을 수 있게 Actions 결과물과 초안(draft) 릴리스에만 올린다.
name: 안드로이드 APK 빌드

on:
  push:
    branches: [apk-build]
  workflow_dispatch:

permissions:
  contents: write

# 플레이에 올릴 때마다 커져야 하는 버전 번호 = 액션 실행 번호
env:
  VERSION_CODE: ${{ github.run_number }}

jobs:
  apk:
    # 안드로이드 SDK 가 미리 설치된 이미지
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: 웹 빌드
        working-directory: mobile
        run: |
          set -o pipefail
          { npm ci && npx tsc --noEmit && npx vite build && npx cap sync android; } 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: APK 빌드
        working-directory: mobile/android
        run: |
          set -o pipefail
          echo "ANDROID_HOME=$ANDROID_HOME" | tee -a "$RUNNER_TEMP/build.log"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/block-breaker.apk"

      # 업로드 키는 저장소에 넣지 않고 비밀값(base64)으로 받아 잠깐 파일로 풀어 쓴다
      - name: 출시용 AAB 빌드 (서명)
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error title=업로드 키 없음::저장소 비밀값 ANDROID_KEYSTORE_BASE64 가 없어서 AAB 를 서명할 수 없습니다."
            exit 1
          fi
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          # 복사할 때 섞인 줄바꿈·공백 같은 글자는 걸러 낸다
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$ANDROID_KEYSTORE_FILE"
          # 키 파일과 비밀번호가 맞는지 먼저 확인 (틀리면 여기서 알기 쉽게 멈춤)
          if ! keytool -list -keystore "$ANDROID_KEYSTORE_FILE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>"$RUNNER_TEMP/keytool.err"; then
            cat "$RUNNER_TEMP/keytool.err" | tee -a "$RUNNER_TEMP/build.log"
            echo "::error title=업로드 키 확인 실패::키 파일, 비밀번호, 별칭(upload) 중 하나가 맞지 않습니다."
            exit 1
          fi
          ./gradlew bundleRelease --no-daemon --stacktrace 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          rm -f "$ANDROID_KEYSTORE_FILE"
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/retro-arcade-$VERSION_CODE.aab"

      - uses: actions/upload-artifact@v5
        with:
          name: block-breaker-apk
          path: block-breaker.apk

      - uses: actions/upload-artifact@v5
        with:
          name: retro-arcade-aab
          path: retro-arcade-*.aab

      # 초안은 공개되지 않는다. 확인한 뒤 직접 내용을 고쳐 공개하거나 지우면 된다
      - name: 초안 릴리스에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-build-${{ github.run_number }}" block-breaker.apk retro-arcade-*.aab \
            --draft \
            --target "${{ github.sha }}" \
            --title "앱 빌드 ${{ github.run_number }}" \
            --notes "자동으로 빌드한 파일입니다. APK 는 폰에 바로 설치하는 테스트용(debug), AAB 는 구글 플레이 콘솔에 올리는 출시용(버전 번호 ${{ github.run_number }})입니다."

      # 실패하면 마지막 로그를 오류 표시로 남김 (커밋 화면에서 바로 확인)
      - name: 실패 로그
        if: failure()
        run: |
          touch "$RUNNER_TEMP/build.log"
          msg=$(tail -n 50 "$RUNNER_TEMP/build.log" | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"}{print}')
          echo "::error title=빌드 실패 로그::${msg}"
